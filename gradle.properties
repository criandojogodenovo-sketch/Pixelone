# Pixel One — propriedades do build Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Correções locais de performance/NDK (sessão de correção):
# - daemon e workers com memória contida (ambientes de CI pequenos);
# - CMake em paralelo limitado;.kotlin multidex desligado (não necessário).
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx1024m
